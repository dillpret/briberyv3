@if (errors.message()) {
  <section class="mx-auto mt-4 max-w-2xl px-4">
    <div class="flex items-start justify-between gap-3 rounded-lg border border-error/30 bg-error/10 px-4 py-3 text-sm font-semibold text-error">
      <p>{{ errors.message() }}</p>
      <button
        type="button"
        class="shrink-0 text-error/70 transition hover:text-error"
        aria-label="Dismiss error"
        (click)="errors.clear()">
        Dismiss
      </button>
    </div>
  </section>
}

@if (!helpModal.activeModal()) {
  <button
    type="button"
    class="fixed right-2 top-2 z-40 inline-flex items-center justify-center rounded-full border-2 border-ink/20 bg-surface/95 px-3 py-1.5 text-xs font-black text-pine shadow-lg shadow-pine/15 transition hover:border-sun hover:text-ink active:scale-[0.97] sm:right-5 sm:top-5 sm:px-4 sm:py-2 sm:text-sm"
    aria-label="Open how to play instructions"
    (click)="openInstructions()">
    How to play
  </button>
}

<router-outlet />

<app-help-modals />
