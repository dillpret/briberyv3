<div
  class="fixed inset-0 z-[80] flex items-center justify-center bg-ink/50 px-3 py-5 backdrop-blur-sm sm:px-6"
  role="presentation"
  (click)="closeOverlay.emit()">
  <section
    class="soft-panel max-h-[calc(100vh-2.5rem)] w-full max-w-4xl overflow-auto !bg-surface p-0 shadow-2xl shadow-ink/25"
    [ngClass]="panelClass"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="$event.stopPropagation()">
    <div class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b-2 border-ink/10 bg-surface/95 px-4 py-3 backdrop-blur sm:px-5">
      <h2 class="text-lg font-black text-ink sm:text-xl">{{ title }}</h2>
      <button
        #closeButton
        type="button"
        class="secondary-button !w-auto px-3 py-2 text-sm"
        aria-label="Close help"
        (click)="closeOverlay.emit()">
        Close
      </button>
    </div>
    <ng-content />
  </section>
</div>
