<app-help-overlay title="How to play" (closeOverlay)="close()">
  <div class="mx-auto max-w-2xl space-y-4 p-5 sm:p-7">
      @if (steps[currentStep()]; as step) {
        <article class="nested-panel flex min-h-[19rem] flex-col items-center justify-center border-pine/20 bg-surface/70 text-center sm:min-h-[23rem] sm:px-8">
          <span class="status-pill mx-auto border-sun bg-sun text-ink">
            Step {{ currentStep() + 1 }} of {{ steps.length }}
          </span>
          <img
            [src]="step.image"
            alt=""
            aria-hidden="true"
            class="mascot-waiting mx-auto max-h-28 object-contain sm:max-h-36"
            [class.mascot-rocking]="currentStep() >= 4" />
          <p class="text-2xl font-black leading-tight text-ink sm:text-3xl">{{ step.text }}</p>
        </article>
      }

      <div class="flex items-center justify-between gap-3">
        <button
          type="button"
          class="secondary-button py-2"
          [disabled]="currentStep() === 0"
          (click)="previousStep()">
          Previous
        </button>
        <button
          type="button"
          class="primary-button py-2"
          [disabled]="currentStep() === steps.length - 1"
          (click)="nextStep()">
          Next
        </button>
      </div>

      <div class="flex justify-center gap-2" aria-label="Instruction steps">
        @for (step of steps; track step.text; let index = $index) {
          <button
            type="button"
            class="h-3 w-3 rounded-full border border-ink/25"
            [class.bg-pine]="index === currentStep()"
            [class.bg-surface]="index !== currentStep()"
            [attr.aria-label]="'Show step ' + (index + 1)"
            [attr.aria-current]="index === currentStep() ? 'step' : null"
            (click)="setStep(index)">
          </button>
        }
      </div>
  </div>
</app-help-overlay>
