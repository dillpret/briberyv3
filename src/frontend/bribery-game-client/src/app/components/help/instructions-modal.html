<app-help-overlay title="How to play" panelClass="max-w-[32rem]" (closeOverlay)="close()">
  <div class="mx-auto grid w-full grid-rows-[1fr_auto_auto] gap-3 p-3 sm:gap-4 sm:p-4">
      @if (steps[currentStep()]; as step) {
        <article class="overflow-hidden rounded-[var(--radius-nested)] border-2 border-ink/15 bg-surface/70 shadow-inner">
          <span class="status-pill border-sun bg-sun text-ink">
            Page {{ currentStep() + 1 }} of {{ steps.length }}
          </span>
          <img
            [src]="step.image"
            [alt]="step.label"
            width="1086"
            height="1448"
            class="block max-h-[calc(100dvh-13rem)] w-full object-contain" />
        </article>
      }

      <div class="flex items-center justify-between gap-3">
        <button
          type="button"
          class="secondary-button py-2"
          [disabled]="currentStep() === 0"
          (click)="previousStep()">
          Previous
        </button>
        <button
          type="button"
          class="primary-button py-2"
          [disabled]="currentStep() === steps.length - 1"
          (click)="nextStep()">
          Next
        </button>
      </div>

      <div class="flex justify-center gap-2" aria-label="Instruction steps">
        @for (step of steps; track step.image; let index = $index) {
          <button
            type="button"
            class="h-3 w-3 rounded-full border border-ink/25"
            [class.bg-pine]="index === currentStep()"
            [class.bg-surface]="index !== currentStep()"
            [attr.aria-label]="'Show step ' + (index + 1)"
            [attr.aria-current]="index === currentStep() ? 'step' : null"
            (click)="setStep(index)">
          </button>
        }
      </div>
  </div>
</app-help-overlay>
