<app-help-overlay title="Welcome to Bribery!" panelClass="max-w-3xl" (closeOverlay)="close()">
  <div class="p-5 sm:p-7">
    <div class="mx-auto max-w-2xl space-y-5 text-center">
      <img
        src="/brand/bribery-logo.png"
        alt="Bribery"
        class="brand-logo mx-auto max-w-[20rem] sm:max-w-[25rem]" />

      <div class="space-y-3">
        <h3 class="text-3xl font-black leading-tight text-ink sm:text-4xl">{{ lines[0] }}</h3>
        <p class="text-xl font-black leading-snug text-pine">{{ lines[1] }}</p>
        <p class="text-base font-semibold leading-7 text-ink/75">{{ lines[2] }}</p>
        <p class="rounded-[var(--radius-nested)] border-2 border-sun/65 bg-sun/15 p-4 text-base font-semibold leading-7 text-ink sm:px-6">
          {{ lines[3] }}
        </p>
      </div>
    </div>
  </div>
</app-help-overlay>
