@if (isVisible()) {
  <div class="phase-clock" [class.is-warning]="isWarning()">
    <div class="clock-copy">
      <p class="clock-label">Time remaining</p>
      <p class="clock-hint">Auto-submits when time runs out.</p>
    </div>
    <span class="clock-value" role="timer" aria-label="Time remaining">
      {{ displayTime() }}
    </span>
  </div>
}
