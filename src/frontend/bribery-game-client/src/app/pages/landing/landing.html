<main class="phase-shell justify-center">
  <section class="text-center">
    <img
      src="/brand/bribery-logo.png"
      alt="Bribery"
      class="brand-logo mx-auto" />
  </section>

  @if (errorMessage) {
    <section class="soft-panel notice-panel text-center text-sm font-semibold text-ink">
      {{ errorMessage }}
    </section>
  }

  <section class="soft-panel space-y-5">
    <label class="block space-y-2">
      <span class="text-sm font-black uppercase tracking-wide text-ink/70">Your name</span>
      <input
        [(ngModel)]="name"
        [attr.maxlength]="maxPlayerNameLength"
        class="soft-input text-lg font-bold"
        autocomplete="nickname"
        placeholder="Enter your name" />
      <span class="block text-xs font-semibold text-ink/55">
        Up to {{ maxPlayerNameLength }} characters.
      </span>
    </label>

    <div class="grid gap-4 sm:grid-cols-2">
      <section class="nested-panel border-pine/25 shadow-mint/30">
        <div class="space-y-1">
          <h2 class="text-lg font-black text-ink">Create a new game</h2>
          <p class="text-sm font-semibold leading-snug text-ink/65">
            Start a room and share the code with friends.
          </p>
        </div>

        <button
          (click)="createGame()"
          [disabled]="!name.trim()"
          class="primary-button">
          Create game
        </button>
      </section>

      <section class="nested-panel border-plum/25 shadow-plum/10">
        <div class="space-y-1">
          <h2 class="text-lg font-black text-ink">Join existing game</h2>
          <p class="text-sm font-semibold leading-snug text-ink/65">
            Enter the room code someone shared with you.
          </p>
        </div>

        <label class="block space-y-2">
          <span class="text-sm font-semibold text-ink/80">Game code</span>
          <input
            [(ngModel)]="gameId"
            (ngModelChange)="gameId = normalizeGameId($event)"
            class="soft-input uppercase"
            autocomplete="off"
            placeholder="AB12" />
        </label>

        <button
          (click)="join()"
          [disabled]="!name.trim() || !gameId.trim()"
          class="secondary-button">
          Join game
        </button>
      </section>
    </div>
  </section>

  <button
    type="button"
    class="mx-auto -mt-2 text-sm font-black text-plum underline decoration-plum/35 underline-offset-4 transition hover:text-ink"
    aria-label="Open Bribery introduction"
    (click)="openSplash()">
    About Bribery
  </button>

  <p class="mx-auto max-w-md text-center text-xs font-semibold leading-snug text-ink/60">
    Please send any feedback, suggestions, or feature requests to
    <a
      href="mailto:dillon.pretorius@entelect.co.za"
      class="text-plum underline decoration-plum/35 underline-offset-2">
      dillon.pretorius&#64;entelect.co.za
    </a>
  </p>

  <p class="text-center text-[0.65rem] font-medium text-ink/45">
    {{ deploymentLabel }}
  </p>
</main>
